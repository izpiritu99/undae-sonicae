# Builds the native edition for Windows, macOS and Linux and publishes them as a GitHub Release (tag v<version>).
# Start it from the Actions tab ("Run workflow") or: gh workflow run release.yml -f version=0.3.0
# The Android APK is built on the owner's PC (it keeps the same signing key as the phone's install) and added with
# gh release upload v<version> <apk>.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (the tag will be v<version>)"
        required: true
        default: "0.3.0"
      platforms:
        description: "Which to build: all, or a list like windows,linux (files of the others stay as they are)"
        required: true
        default: "all"

permissions:
  contents: write

jobs:
  windows:
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - run: git config --global core.autocrlf false   # JUCE's patch must meet JUCE's own line endings
      - uses: actions/checkout@v5
      - name: JUCE 8.0.15 with the project's patch
        shell: bash
        run: |
          git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE cpp/third_party/JUCE
          git -C cpp/third_party/JUCE apply ../../patches/juce-android.patch
      - name: Build and self-test
        shell: cmd
        run: |
          call cpp\build-win.bat || exit /b 1
          cpp\build\undae-selftest_artefacts\Release\undae-selftest.exe cpp\examples\first-light.undae.json > selftest.log 2>&1
          type selftest.log | findstr /c:"all passed" || (type selftest.log & exit /b 1)
      - name: LAME for MP3 export (built from source by vcpkg)
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install mp3lame:x64-windows
          $dll = Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" -Filter "*lame*.dll" | Select-Object -First 1
          Copy-Item $dll.FullName "cpp\build\UndaeSonicae_artefacts\Release\libmp3lame.dll"
          "bundled $($dll.Name) as libmp3lame.dll"
      - name: Microsoft C++ runtime next to the app (app-local)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Recurse -Directory -Filter "Microsoft.VC14*.CRT" | Where-Object FullName -match '\\x64\\' | Where-Object FullName -notmatch 'onecore|debug' | Select-Object -First 1
          foreach ($f in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") { Copy-Item (Join-Path $crt.FullName $f) "cpp\build\UndaeSonicae_artefacts\Release\" }
          "C++ runtime from $($crt.FullName)"
      - name: Installer (Inno Setup) and portable zip
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=$v" installer\windows.iss; if ($LASTEXITCODE) { exit 1 }
          $p = "dist\portable\Undae Sonicae"; New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item "cpp\build\UndaeSonicae_artefacts\Release\Undae Sonicae.exe", "native\bin\undae-vsthost.exe", "native\bin\undae-vsthost32.exe", "app\img\wordmark.png" $p
          Copy-Item "cpp\build\UndaeSonicae_artefacts\Release\*.dll" $p   # LAME and the C++ runtime
          Compress-Archive -Path $p -DestinationPath "dist\Undae-Sonicae-$v-windows-portable.zip"
          Get-ChildItem dist -File
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            dist/*-windows-setup.exe
            dist/*-windows-portable.zip

  mac:
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'mac')
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: brew install ninja lame
      - name: JUCE 8.0.15 with the project's patch
        run: |
          git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE cpp/third_party/JUCE
          git -C cpp/third_party/JUCE apply ../../patches/juce-android.patch
      - name: Build, self-test, sign, pack
        run: |
          cpp/build-mac.sh Release
          mv cpp/dist/Undae-Sonicae-0.3.0-mac.dmg "cpp/dist/Undae-Sonicae-${{ inputs.version }}-mac.dmg" 2>/dev/null || true
      - uses: actions/upload-artifact@v5
        with:
          name: mac
          path: cpp/dist/*.dmg

  linux:
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'linux')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Build tools and JUCE's Linux packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential cmake ninja-build pkg-config libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev squashfs-tools xvfb
      - name: JUCE 8.0.15 with the project's patch
        run: |
          git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE cpp/third_party/JUCE
          git -C cpp/third_party/JUCE apply ../../patches/juce-android.patch
      - name: AppImage runtime (static; needs no libfuse2)
        run: |
          mkdir -p ~/.cache/undae-sonicae
          curl -fsSL -o ~/.cache/undae-sonicae/runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
      - name: Build, self-test, package (.deb and AppImage)
        run: |
          xvfb-run -a sh cpp/package.sh
          v="${{ inputs.version }}"
          mv dist/undae-sonicae-native_*_amd64.deb "dist/undae-sonicae_${v}_amd64.deb"
          mv "dist/Undae Sonicae Native-"*.AppImage "dist/Undae-Sonicae-${v}-linux-x86_64.AppImage"
          ls -l dist
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.AppImage

  publish:
    needs: [windows, mac, linux]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}   # also when some platforms were skipped
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ inputs.version }}"
          ls -l out
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" out/* --target "$GITHUB_SHA" --title "Undae Sonicae ${{ inputs.version }}" --notes-file installer/RELEASE_NOTES.md
          fi
